
<html> <head>    <title>DIY e-HandPan</title>
  <meta charset='UTF-8'>
  <style>
    body { background-color: #FAFAFA; font-family: Arial, Helvetica, Sans-Serif; font-size: 15px; Color: #000000; }
    h2 { Color: #0c0cd4; font-size: 25px; }
    h3 { Color: #2E2EFE; font-size: 20px; }
    table { border: 0 } 
    table.kb { border: 0   } 
    th { border: thin solid #6495ed;  padding: 2px; background-color: #D0E3FA;  } 
    td { border: thin solid #6495ed;  padding: 2px; text-align: center; background-color: #ffffff; }
    td.vide { border: 0;  padding: 5px; text-align: center; background-color: #ffffff; }
    td.blanche { border: thin solid #6495ed;  padding: 5px; text-align: center; background-color: #d3cfcf; }
    td.noire { border: thin solid #6495ed;  padding: 5px; text-align: center; background-color: #4b4949; }
    input.plage { text-align: right; margin-right: 5px;   } 
  </style>
</head>
<script>
var idChange=0;
var playing=0;
function doAction(action,arg1) {
var xhttp = new XMLHttpRequest();
xhttp.onreadystatechange = function() {
  if (this.readyState == 4 && this.status == 200) {
  }
};
var tmp = '&idChange='+idChange;
if (action=='bpm') {
  tmp = '&arg1=' + document.getElementById('bpmtxt').value;
} else if ( action=='volgen') {
  tmp = '&arg1=' + document.getElementById('volgentxt').value;
} else if ( action=='measurefirst') {
  tmp = '&arg1=' + document.getElementById('measurefirst').value;
} else if ( action=='measurelast') {
  tmp = '&arg1=' + document.getElementById('measurelast').value;
} else {
  tmp = '&arg1=' + arg1
}
var uri = 'rest?action=' + action + tmp;
xhttp.open('GET', uri, true);
xhttp.send(); 
}

function checkActivation() {
if (document.getElementById('filename').innerHTML=='' ) {
 document.getElementById('tsong').style.display='none';
} else {
 document.getElementById('tsong').style.display='block';
}
if ( playing ) {
 document.getElementById('stop').disabled=false;
 document.getElementById('learn').disabled=true;
 document.getElementById('play').disabled=true;
 document.getElementById('trunning').style.display='block';
} else {
 document.getElementById('stop').disabled=true;
 document.getElementById('learn').disabled=false;
 document.getElementById('play').disabled=false;
 document.getElementById('trunning').style.display='none';
}
}
function getMusicData() {
var xhttp = new XMLHttpRequest();
xhttp.onreadystatechange = function() {
  if (this.readyState == 4 && this.status == 200) {
    const obj = JSON.parse(this.responseText);
    const idChangeNew = obj.idchange;
    document.getElementById('msg').innerHTML = obj.msg;
    if (idChange != idChangeNew) {
      playing  = obj.playing;
      document.getElementById('filename').innerHTML = obj.filename;
      document.getElementById('nbnotes').innerHTML = obj.nbnotes;
      document.getElementById('nbmeasures').innerHTML = obj.nbmeasures;
      document.getElementById('bpmbase').innerHTML = obj.bpmbase;
      document.getElementById('keysign').innerHTML = obj.keysign;
      document.getElementById('timesign').innerHTML = obj.timesign;
      if (playing) {
        document.getElementById('mode').innerHTML = obj.mode;
      } else {
        document.getElementById('mode').innerHTML = "";
      }
      document.getElementById('bpmtxt').textContent = obj.bpm;
      document.getElementById('bpminput').value = obj.bpm;
      document.getElementById('volgentxt').textContent = obj.volgen;
      document.getElementById('volgeninput').value = obj.volgen;
      document.getElementById('version').innerHTML = obj.version;
      document.getElementById('measurefirst').min = '1';
      document.getElementById('measurefirst').max = obj.measurelast;
      document.getElementById('measurefirst').value = obj.measurefirst;
      document.getElementById('measurelast').min = obj.measurefirst;
      document.getElementById('measurelast').max = obj.nbmeasures;
      document.getElementById('measurelast').value = obj.measurelast;
      checkActivation();
    }
    if (playing) {
      document.getElementById('curmeasure').innerHTML =  obj.curmeasure;
      document.getElementById('curnote').innerHTML =  obj.curnote;
      document.getElementById('progression').value = obj.progression;
    }
  }
};
xhttp.open('GET', '/rest?action=info', true);
xhttp.send(); 
}
</script>
<body>
<h2>DIY e-HandPan</h2>
<p><b><span id='msg'></b><p>
<table id='tgeneral'><tr><th>Volume</th>
<td><input id='volgeninput' type='range' min='0' max='100' step=1 value='0'/><output id='volgentxt'></output></td></tr>
<tr><th>Fichier MIDI</th>
   <td><form method='POST' action='/upload' enctype='multipart/form-data'><input type='file' id='filemidi' accept='.mid,.midi' name='data' onchange='form.submit()' /> </form></td></tr>
<tr><th> &nbsp;</th>  <td><button onclick=" doAction('info','');  "  id='refresh' >Refresh</button></td></tr>
</table><p>
<table id='tsong'>
<tr><th>Commandes</th><td>
<button onclick=" doAction('learn','');  "  id='learn' >Apprentissage</button>
<button onclick=" doAction('play','');  "  id='play' >Séquenceur</button>
<button onclick=" doAction('stop','');  "  id='stop' >Stop</button>
</td></tr>
<tr><th>BPM</th>
<td><input id='bpminput' type='range' min='30' max='200' step=1 value='30'/><output id='bpmtxt'></output></td></tr>
<tr><th> Fichier </th>        <td> <div id='filename'></div></td></tr>
<tr><th> Clé</th>             <td> <div id='keysign'/></td></tr>
<tr><th> Temps</th>           <td> <div id='timesign'/></td></tr>
<tr><th> BPM d'origine</th>   <td> <div id='bpmbase'/></td></tr>
<tr><th> Nb mesures </th>     <td> <div id='nbmeasures'/> </td></tr>
<tr><th> Nb notes</th>        <td> <div id='nbnotes'/></td></tr>
<tr><th> Mesures à jouer</th> <td> De <input id='measurefirst' name='measurefirst' type='number' min='1' max='100' required step=1 value='1'/> à <input id='measurelast' name='measurelast' type='number' min='1' max='100' required step=1 value='100'/> </td></tr>
</table><p>
<table id='trunning'>
<tr><th> Mode </th>           <td> <div id='mode'/></td></tr>
<tr><th> Mesure en court</th> <td> <div id='curmeasure'/></td></tr>
<tr><th> Note en court</th> <td>   <div id='curnote'/></td></tr>
<tr><th>Avancement</th>       <td> <progress id='progression' value="" max="100"></progress></td></tr>
</table>
<p><table class='kb'><tr>
<tr>
<td class='vide'> &nbsp; </td>
<td colspan=2 class='noire'> <button onclick="doAction('playnote','1');"  id='playnote'> A# </button> </td>
<td class='vide' colspan=2> &nbsp; </td>
<td colspan=2 class='noire'> <button onclick="doAction('playnote','4');"  id='playnote'> C# </button> </td>
<td colspan=2 class='noire'> <button onclick="doAction('playnote','6');"  id='playnote'> D# </button> </td>
<td class='vide' colspan=2> &nbsp; </td>
<td colspan=2 class='noire'> <button onclick="doAction('playnote','9');"  id='playnote'> F# </button> </td>
<td colspan=2 class='noire'> <button onclick="doAction('playnote','11');" id='playnote'> G# </button> </td>
<td colspan=2 class='noire'> <button onclick="doAction('playnote','13');" id='playnote'> A# </button> </td>
</tr>
<tr>
<td colspan=2 class='blanche'> <button onclick="doAction('playnote','0');"  id='playnote'> A </button> </td>
<td colspan=2 class='blanche'> <button onclick="doAction('playnote','2');"  id='playnote'> B </button> </td>
<td colspan=2 class='blanche'> <button onclick="doAction('playnote','3');"  id='playnote'> C </button> </td>
<td colspan=2 class='blanche'> <button onclick="doAction('playnote','5');"  id='playnote'> D </button> </td>
<td colspan=2 class='blanche'> <button onclick="doAction('playnote','7');"  id='playnote'> E </button> </td>
<td colspan=2 class='blanche'> <button onclick="doAction('playnote','8');" id='playnote'> F </button> </td>
<td colspan=2 class='blanche'> <button onclick="doAction('playnote','10');" id='playnote'> G </button> </td>
<td colspan=2 class='blanche'> <button onclick="doAction('playnote','12');" id='playnote'> A </button> </td>
<td class='vide'> &nbsp; </td>
</tr>
</tr></table>
<p>Version : <span id='version'/>
<script>

const bpmtxt = document.querySelector('#bpmtxt');
const bpminput = document.querySelector('#bpminput');
bpmtxt.textContent = bpminput.value;
bpminput.addEventListener('input', (event) => {  bpmtxt.textContent = event.target.value; }); 
bpminput.addEventListener('mouseup', (event) => {  doAction('bpm',event.target.value); }); 

const volgentxt = document.querySelector('#volgentxt');
const volgeninput = document.querySelector('#volgeninput');
volgentxt.textContent = volgeninput.value;
volgeninput.addEventListener('input', (event) => {  volgentxt.textContent = event.target.value; }); 
volgeninput.addEventListener('mouseup', (event) => {  doAction('volgen',event.target.value); }); 

const measurefirst = document.querySelector('#measurefirst'); 
const measurelast = document.querySelector('#measurelast');  
measurefirst.addEventListener('input', (event) => { measurelast.min = event.target.value; doAction('measurefirst',event.target.value);});  
measurelast.addEventListener('input', (event) => { measurefirst.max = event.target.value; doAction('measurelast',event.target.value);});  

setInterval(function() {getMusicData();}, 2000);

</script>
</body>
</html>
